name: Deployment zu Hostinger

# GitHub baut, Hostinger liefert nur aus.
#
# Das Shared Hosting von Hostinger fuehrt keinen Node-Build aus. Deshalb
# entsteht das fertige Bundle hier und wird anschliessend per FTP hochgeladen.
# Hostinger muss dadurch nichts koennen ausser Dateien auszuliefern.
#
# ZWEI ZIELE — erst testen, dann freigeben:
#   - Arbeitszweig  → test.js-rentenplaner.de: jede Aenderung landet zuerst
#     hier, mit Band "Testversion" und fuer Suchmaschinen gesperrt.
#   - Branch `live` → js-rentenplaner.de: nur, was auf der Testseite geprueft
#     und freigegeben ist. Freigeben heisst, `live` auf den gepruften Stand
#     vorzuziehen; Zurueckrollen, `live` auf einen frueheren Stand zu setzen.
# Beide Seiten nutzen DIESELBE Datenbank. Datenbank-Aenderungen muessen
# deshalb abwaertskompatibel sein: Die Live-Seite laeuft mit ihrem Stand weiter.

on:
  push:
    branches: [live, claude/german-pension-calculator-review-cql8d6]
  workflow_dispatch:

# Zwei gleichzeitige Deployments auf DASSELBE Ziel wuerden sich in die Quere
# kommen: Das neuere gewinnt, das aeltere wird abgebrochen. Test und Live
# laufen unabhaengig voneinander.
concurrency:
  group: deployment-hostinger-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  bauen-und-ausliefern:
    runs-on: ubuntu-latest
    env:
      ZIEL: ${{ github.ref_name == 'live' && 'live' || 'test' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Keine version angeben: Die Version steht in package.json unter
        # "packageManager" und ist damit die einzige Quelle. Zwei Angaben
        # lehnt die Action ab (ERR_PNPM_BAD_PM_VERSION).

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Abhaengigkeiten installieren
        run: pnpm install --frozen-lockfile

      # Bauen MUSS vor Typpruefung und Tests kommen: engine und schema liefern
      # ihre Typdeklarationen erst nach dem Build in dist/. Ohne das findet
      # tsc die Pakete nicht und meldet Dutzende Folgefehler.
      - name: Bauen
        env:
          # Vite setzt diese Werte BEIM BAUEN in das Bundle ein, nicht zur
          # Laufzeit. Sie muessen deshalb hier vorliegen, nicht auf dem Server.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # "test": Band "Testversion" und noindex auf jeder Seite (vite.config.ts).
          VITE_UMGEBUNG: ${{ env.ZIEL }}
        run: pnpm -r build

      - name: Typen pruefen
        run: pnpm -r typecheck

      # Kaputter Code darf nicht online gehen. Schlaegt etwas fehl, bricht der
      # Lauf ab und das Deployment findet nicht statt.
      - name: Tests
        run: pnpm -r test

      - name: Build pruefen
        run: |
          test -f apps/web/dist/index.html || { echo "index.html fehlt"; exit 1; }
          test -f apps/web/dist/.htaccess  || { echo ".htaccess fehlt — SPA-Routing waere kaputt"; exit 1; }
          test -f apps/web/dist/altersvorsorgedepot.html || { echo "Landingpage fehlt"; exit 1; }
          # Die Umschreibungsregel MUSS vor dem Auffangmuster stehen, sonst
          # landet /altersvorsorgedepot im Rechner statt auf der Landingpage.
          awk '/altersvorsorgedepot\.html/ { a=NR } /RewriteRule \. \/index\.html/ { b=NR } END { exit !(a && b && a < b) }' apps/web/dist/.htaccess \
            || { echo "Umschreibungsregel fuer /altersvorsorgedepot fehlt oder steht hinter dem Auffangmuster"; exit 1; }
          # Dasselbe fuer den Vorsorge-Check.
          test -f apps/web/dist/vorsorge-check.html || { echo "Vorsorge-Check fehlt"; exit 1; }
          awk '/vorsorge-check\.html/ { a=NR } /RewriteRule \. \/index\.html/ { b=NR } END { exit !(a && b && a < b) }' apps/web/dist/.htaccess \
            || { echo "Umschreibungsregel fuer /vorsorge-check fehlt oder steht hinter dem Auffangmuster"; exit 1; }
          # Und fuer die Arbeitgeber-Seite.
          test -f apps/web/dist/arbeitgeber.html || { echo "Arbeitgeber-Seite fehlt"; exit 1; }
          awk '/arbeitgeber\.html/ { a=NR } /RewriteRule \. \/index\.html/ { b=NR } END { exit !(a && b && a < b) }' apps/web/dist/.htaccess \
            || { echo "Umschreibungsregel fuer /arbeitgeber fehlt oder steht hinter dem Auffangmuster"; exit 1; }
          test -f apps/web/dist/zuschussmodell.html || { echo "Zuschussmodell fehlt"; exit 1; }
          awk '/zuschussmodell\.html/ { a=NR } /RewriteRule \. \/index\.html/ { b=NR } END { exit !(a && b && a < b) }' apps/web/dist/.htaccess \
            || { echo "Umschreibungsregel fuer /zuschussmodell fehlt oder steht hinter dem Auffangmuster"; exit 1; }
          test -f apps/web/dist/festbetrag.html || { echo "Festbetrag-Seite fehlt"; exit 1; }
          awk '/festbetrag\.html/ { a=NR } /RewriteRule \. \/index\.html/ { b=NR } END { exit !(a && b && a < b) }' apps/web/dist/.htaccess \
            || { echo "Umschreibungsregel fuer /festbetrag fehlt oder steht hinter dem Auffangmuster"; exit 1; }
          test -f apps/web/dist/bkv.html || { echo "bKV-Seite fehlt"; exit 1; }
          awk '/bkv\.html/ { a=NR } /RewriteRule \. \/index\.html/ { b=NR } END { exit !(a && b && a < b) }' apps/web/dist/.htaccess \
            || { echo "Umschreibungsregel fuer /bkv fehlt oder steht hinter dem Auffangmuster"; exit 1; }
          # Die Preisseite. Nur die RewriteRule zaehlt — "preise.html" steht
          # auch in der Kopfzeilen-Regel weiter unten.
          test -f apps/web/dist/preise.html || { echo "Preisseite fehlt"; exit 1; }
          awk '/RewriteRule \^preise/ { a=NR } /RewriteRule \. \/index\.html/ { b=NR } END { exit !(a && b && a < b) }' apps/web/dist/.htaccess \
            || { echo "Umschreibungsregel fuer /preise fehlt oder steht hinter dem Auffangmuster"; exit 1; }
          # Bis zum Start des Abos nicht in Suchmaschinen. Faellt beim Start mit weg.
          grep -q 'name="robots" content="noindex' apps/web/dist/preise.html \
            || { echo "Preisseite ohne noindex — sie soll vorerst nicht in Suchmaschinen"; exit 1; }
          # Impressum und Datenschutz sind Pflicht — ohne sie nicht ausliefern.
          for s in impressum datenschutz nutzungsbedingungen; do
            test -f apps/web/dist/$s.html || { echo "$s fehlt"; exit 1; }
            awk -v s="$s" '$0 ~ s"\\.html" { a=NR } /RewriteRule \. \/index\.html/ { b=NR } END { exit !(a && b && a < b) }' apps/web/dist/.htaccess \
              || { echo "Umschreibungsregel fuer /$s fehlt oder steht hinter dem Auffangmuster"; exit 1; }
          done
          # Seit der Zugangsschranke ist das kein Schoenheitsfehler mehr: Fehlt
          # die Konfiguration, laesst die Schranke den Rechner ungeschuetzt
          # durch (mit Warnband). Lieber gar nicht ausliefern als offen.
          if ! grep -rq "supabase.co" apps/web/dist/assets/*.js; then
            echo "Keine Supabase-URL im Bundle — die Anmeldung waere ausser Kraft."
            echo "Bitte VITE_SUPABASE_URL und VITE_SUPABASE_PUBLISHABLE_KEY als Secrets setzen."
            exit 1
          fi
          echo "Bundle in Ordnung:"; du -sh apps/web/dist

      # Nur die Testseite: Suchmaschinen fernhalten (zusaetzlich zum noindex im
      # HTML), und wer sie ueber js-rentenplaner.de/test/ aufruft — der Ordner
      # liegt in der Dokumentwurzel der Live-Seite —, landet auf der Subdomain.
      - name: Testseite abschirmen
        if: env.ZIEL == 'test'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > apps/web/dist/robots.txt
          sed -i 's|^  RewriteBase /$|  RewriteBase /\n\n  # Nur Testseite: Aufrufe ueber die Live-Domain auf die Subdomain.\n  RewriteCond %{HTTP_HOST} !^test\\. [NC]\n  RewriteRule ^ https://test.js-rentenplaner.de/ [R=302,L]|' apps/web/dist/.htaccess
          grep -q 'RewriteRule ^ https://test.js-rentenplaner.de/' apps/web/dist/.htaccess \
            || { echo "Umleitung fuer die Testseite fehlt — RewriteBase nicht gefunden?"; exit 1; }
          cat >> apps/web/dist/.htaccess <<'EOF'

          # --- Nur Testseite: nicht in Suchmaschinen -------------------------------
          <IfModule mod_headers.c>
            Header always set X-Robots-Tag "noindex, nofollow"
          </IfModule>
          EOF
          grep -q 'TESTVERSION' apps/web/dist/index.html || { echo "Band Testversion fehlt im Build"; exit 1; }

      - name: Per FTP zu Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./apps/web/dist/
          # Der Haupt-FTP-Zugang von Hostinger landet im Heimatverzeichnis
          # (/home/u964247325/), nicht in der Dokumentwurzel. Der Pfad dorthin
          # stammt aus der Hostinger-API:
          #   /home/u964247325/domains/js-rentenplaner.de/public_html
          # Landet der FTP-Zugang doch direkt in der Wurzel, die Variable
          # HOSTINGER_ZIELVERZEICHNIS auf ./ setzen.
          # Die Testseite liegt im Unterordner test/ — so legt hPanel eine
          # Subdomain als "Teil der Website" an. Anderer Ordner: Variable
          # HOSTINGER_TESTVERZEICHNIS setzen.
          server-dir: ${{ env.ZIEL == 'live' && (vars.HOSTINGER_ZIELVERZEICHNIS || 'domains/js-rentenplaner.de/public_html/') || (vars.HOSTINGER_TESTVERZEICHNIS || 'domains/js-rentenplaner.de/public_html/test/') }}
          # Punktdateien muessen mit, sonst fehlt die .htaccess.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
