name: Deployment zu Hostinger

# GitHub baut, Hostinger liefert nur aus.
#
# Das Shared Hosting von Hostinger fuehrt keinen Node-Build aus. Deshalb
# entsteht das fertige Bundle hier und wird anschliessend per FTP hochgeladen.
# Hostinger muss dadurch nichts koennen ausser Dateien auszuliefern.

on:
  push:
    branches: [main, claude/german-pension-calculator-review-cql8d6]
  workflow_dispatch:

# Zwei gleichzeitige Deployments wuerden sich im Zielverzeichnis in die Quere
# kommen. Das neuere gewinnt, das aeltere wird abgebrochen.
concurrency:
  group: deployment-hostinger
  cancel-in-progress: true

jobs:
  bauen-und-ausliefern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Keine version angeben: Die Version steht in package.json unter
        # "packageManager" und ist damit die einzige Quelle. Zwei Angaben
        # lehnt die Action ab (ERR_PNPM_BAD_PM_VERSION).

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Abhaengigkeiten installieren
        run: pnpm install --frozen-lockfile

      # Bauen MUSS vor Typpruefung und Tests kommen: engine und schema liefern
      # ihre Typdeklarationen erst nach dem Build in dist/. Ohne das findet
      # tsc die Pakete nicht und meldet Dutzende Folgefehler.
      - name: Bauen
        env:
          # Vite setzt diese Werte BEIM BAUEN in das Bundle ein, nicht zur
          # Laufzeit. Sie muessen deshalb hier vorliegen, nicht auf dem Server.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm -r build

      - name: Typen pruefen
        run: pnpm -r typecheck

      # Kaputter Code darf nicht online gehen. Schlaegt etwas fehl, bricht der
      # Lauf ab und das Deployment findet nicht statt.
      - name: Tests
        run: pnpm -r test

      - name: Build pruefen
        run: |
          test -f apps/web/dist/index.html || { echo "index.html fehlt"; exit 1; }
          test -f apps/web/dist/.htaccess  || { echo ".htaccess fehlt — SPA-Routing waere kaputt"; exit 1; }
          test -f apps/web/dist/altersvorsorgedepot.html || { echo "Landingpage fehlt"; exit 1; }
          # Die Umschreibungsregel MUSS vor dem Auffangmuster stehen, sonst
          # landet /altersvorsorgedepot im Rechner statt auf der Landingpage.
          awk '/altersvorsorgedepot\.html/ { a=NR } /RewriteRule \. \/index\.html/ { b=NR } END { exit !(a && b && a < b) }' apps/web/dist/.htaccess \
            || { echo "Umschreibungsregel fuer /altersvorsorgedepot fehlt oder steht hinter dem Auffangmuster"; exit 1; }
          if ! grep -rq "supabase.co" apps/web/dist/assets/*.js; then
            echo "Warnung: Keine Supabase-URL im Bundle. Sind die Secrets gesetzt?"
          fi
          echo "Bundle in Ordnung:"; du -sh apps/web/dist

      - name: Per FTP zu Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./apps/web/dist/
          # Der Haupt-FTP-Zugang von Hostinger landet im Heimatverzeichnis
          # (/home/u964247325/), nicht in der Dokumentwurzel. Der Pfad dorthin
          # stammt aus der Hostinger-API:
          #   /home/u964247325/domains/js-rentenplaner.de/public_html
          # Landet der FTP-Zugang doch direkt in der Wurzel, die Variable
          # HOSTINGER_ZIELVERZEICHNIS auf ./ setzen.
          server-dir: ${{ vars.HOSTINGER_ZIELVERZEICHNIS || 'domains/js-rentenplaner.de/public_html/' }}
          # Punktdateien muessen mit, sonst fehlt die .htaccess.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
