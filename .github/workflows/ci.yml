name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Keine version angeben: Die Version steht in package.json unter
        # "packageManager" und ist damit die einzige Quelle. Zwei Angaben
        # lehnt die Action ab (ERR_PNPM_BAD_PM_VERSION).

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pakete bauen
        run: pnpm -r build

      - name: Typen pruefen
        run: pnpm -r typecheck

      - name: Tests
        run: pnpm -r test
